# SWAT4 — Samba 4 Web Administration Tool
# Modo padrao: Samba AD rodando no proprio host.
# Se o seu DC e containerizado (projeto samba-ad-fs), use o override:
#   docker compose -f docker-compose.yml -f docker-compose.dc.yml up -d
# Preencha as variaveis abaixo (ou export no shell). Nunca commite valores reais.

services:
  backend:
    image: ghcr.io/fernandobayit/swat4-backend:latest
    pull_policy: always
    container_name: swat4-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SAMBA_DC_HOST: ${SAMBA_DC_HOST:-host.docker.internal}
      SAMBA_REALM: ${SAMBA_REALM:-SWAT.LOCAL}
      SAMBA_DOMAIN: ${SAMBA_DOMAIN:-SWAT}
      SAMBA_BASE_DN: ${SAMBA_BASE_DN:-DC=swat,DC=local}
      LDAP_URL: ${LDAP_URL:-ldaps://host.docker.internal:636}
      SAMBA_ADMIN_USER: ${SAMBA_ADMIN_USER:-administrator}
      SAMBA_ADMIN_PASSWORD: ${SAMBA_ADMIN_PASSWORD:-ChangeThisPassword}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      ALLOWED_LOGIN_GROUPS: ${ALLOWED_LOGIN_GROUPS:-Domain Admins,Account Operators}
      SAMBA_LOG_PATH: /var/log/samba
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - /etc/samba:/etc/samba
      - /var/log/samba:/var/log/samba:ro
      - /mnt/data:/mnt/data
      - swat4-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/fernandobayit/swat4-frontend:latest
    pull_policy: always
    # O container_name foi removido para multi-host: cada host pode nomear
    # como quiser (via docker -p, Portainer, ou um compose local)
    # NetBird precisa criar a interface wt0 e gerenciar rotas: caps
    # dedicados (em vez de privileged) — portavel entre hosts.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    environment:
      - API_URL=http://backend:8000
      # NetBird embutido (opcional): com setup key definida, o frontend
      # entra na mesh como peer INDEPENDENTE do DC (mesmo modelo do
      # samba-ad-fs). Vazio = sobe apenas o painel, sem NetBird.
      - NETBIRD_MANAGEMENT_URL=${NETBIRD_MANAGEMENT_URL:-}
      - NETBIRD_SETUP_KEY=${NETBIRD_SETUP_KEY:-}
      # NETBIRD_STRICT=true = falha o container se a mesh nao subir
      # (padrao: WARN e sobe so o painel — util em multi-host, onde
      # alguns hosts podem nao ter /dev/net/tun)
      - NETBIRD_STRICT=${NETBIRD_STRICT:-false}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - swat4-netbird-config:/etc/netbird
      - swat4-netbird-estado:/var/lib/netbird

volumes:
  swat4-data:
  swat4-netbird-config:
  swat4-netbird-estado:
